name: Windows beta build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements-build.txt
      - name: Run regression tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/Scripts/python.exe -m unittest discover -v
      - name: Build and smoke-test portable package
        shell: pwsh
        run: .venv/Scripts/python.exe build_windows.py
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: PC-Monitor-Windows-x64-candidate
          path: |
            dist/PC-Monitor-v*-Windows-x64.zip
            dist/PC-Monitor-v*-Windows-x64.zip.sha256
          if-no-files-found: error
      - name: Upload startup screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Windows-smoke-screenshot
          path: build/windows/smoke.png
          if-no-files-found: warn
